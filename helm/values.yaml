# Default values for kure
# This is a YAML-formatted file.

nameOverride: ""
fullnameOverride: ""

global:
  imageRegistry: ""
  imagePullSecrets: []
  initImage:
    repository: curlimages/curl
    tag: "8.15.0"
    pullPolicy: IfNotPresent

# Feature toggles. All features are enabled by default. Set to false to
# disable a feature: the matching tab is hidden in the dashboard, and any
# workloads dedicated to that feature are not deployed.
#
#   podMonitoring → kure-agent DaemonSet + its RBAC + Pod Monitoring tab
#   securityScan  → kure-security-scanner Deployment + its RBAC + Security Scan tab
#   diagram       → Diagram tab (topology view; backend keeps the API)
#   aiAdvice      → Advice tab (AI advisor; backend keeps the API)
features:
  podMonitoring: true
  securityScan: true
  diagram: true
  aiAdvice: true


# Pod monitoring agent configuration
agent:
  # Grace period (seconds) before reporting Pending pods as failed.
  # Pods in Pending phase with no definitive container failure are given
  # this much time to start before being flagged. Default: 120 (2 minutes).
  pendingGracePeriod: 120

  # Failure log capture for CrashLoopBackOff and OOMKilled pods.
  # When enabled, the agent fetches the previous container's logs on failure
  # so the backend can generate a log-aware troubleshoot solution.
  # Other failure types (ImagePullBackOff, Pending, etc.) are NOT affected.
  failureLogs:
    enabled: true   # Set to false to disable failure log capture
    maxLines: 1000  # Max lines per container; also capped at 256 KB raw bytes

  image:
    repository: ghcr.io/igor-koricanac/kure-monitor/agent
    tag: "2.6.0"
    pullPolicy: IfNotPresent

  initImage:
    repository: ""  # Overrides global.initImage.repository when set
    tag: ""         # Overrides global.initImage.tag when set
    pullPolicy: ""

  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

  nodeSelector: {}
  tolerations: []
  affinity: {}

  # RBAC settings
  rbac:
    create: true

  serviceAccount:
    create: true
    name: kure-agent
    automountServiceAccountToken: true  # Required for Kubernetes API access

# Security scanner agent configuration
securityScanner:
  image:
    repository: ghcr.io/igor-koricanac/kure-monitor/security-scanner
    tag: "2.6.0"
    pullPolicy: IfNotPresent

  initImage:
    repository: ""  # Overrides global.initImage.repository when set
    tag: ""         # Overrides global.initImage.tag when set
    pullPolicy: ""

  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

  nodeSelector: {}
  tolerations: []
  affinity: {}

  # RBAC settings
  rbac:
    create: true

  serviceAccount:
    create: true
    name: kure-security-scanner
    automountServiceAccountToken: true  # Required for Kubernetes API access

# Backend configuration
backend:
  replicaCount: 1
  
  image:
    repository: ghcr.io/igor-koricanac/kure-monitor/backend
    tag: "2.6.0"
    pullPolicy: IfNotPresent
  
  service:
    type: ClusterIP
    port: 8000
    targetPort: 8000
  
  resources:
    requests:
      cpu: 200m
      memory: 256Mi
    limits:
      cpu: 1000m
      memory: 1Gi
  
  nodeSelector: {}
  tolerations: []
  affinity: {}

  # RBAC settings for pod logs access
  rbac:
    create: true

  serviceAccount:
    create: true
    name: kure-backend
    automountServiceAccountToken: true  # Required for pod logs API access

# Frontend configuration
frontend:
  replicaCount: 1

  image:
    repository: ghcr.io/igor-koricanac/kure-monitor/frontend
    tag: "2.6.0"
    pullPolicy: IfNotPresent

  service:
    type: ClusterIP
    port: 8080
    targetPort: 8080
    nodePort: ""  # Set when service.type=NodePort

  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

  # Environment variables for React app
  env:
    REACT_APP_API_URL: ""  # Will be set automatically to backend service

  nodeSelector: {}
  tolerations: []
  affinity: {}

  # Service account settings - frontend doesn't need API access
  serviceAccount:
    create: true
    name: kure-frontend
    automountServiceAccountToken: false

# Ingress configuration
ingress:
  enabled: false
  className: ""
  annotations: {}
    # kubernetes.io/ingress.class: nginx
    # kubernetes.io/tls-acme: "true"
  hosts:
    - host: kure.local
      paths:
        - path: /
          pathType: Prefix
          service: frontend
        - path: /api
          pathType: Prefix
          service: backend
  tls: []
    # - secretName: kure-tls
    #   hosts:
    #     - kure.local

# Security context - Container level
securityContext:
  runAsNonRoot: true
  runAsUser: 1001
  runAsGroup: 1001
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL
  seccompProfile:
    type: RuntimeDefault

# PostgreSQL configuration
postgresql:
  external: false  # Set to true to use external PostgreSQL

  # PostgreSQL connection details (for external or internal)
  host: ""  # Only required if external: true
  port: 5432
  database: kure
  username: kure
  password: "kure-password-change-me"  # Change this in production!

  # Internal PostgreSQL deployment settings (ignored if external: true)
  image:
    repository: postgres
    tag: "17.6-alpine3.21"
    pullPolicy: IfNotPresent

  resources:
    requests:
      cpu: 250m
      memory: 256Mi
    limits:
      cpu: 1000m
      memory: 1Gi

  persistence:
    enabled: true
    size: 10Gi
    storageClass: ""
    accessMode: ReadWriteOnce

  # Service account settings - postgresql doesn't need API access
  serviceAccount:
    create: true
    name: kure-postgresql
    automountServiceAccountToken: false

# Security settings
security:
  encryptionKey: ""  # Fernet key for API key encryption (auto-generated if empty)

# Keycloak SSO configuration
keycloak:
  enabled: false
  serverUrl: ""       # e.g., "https://keycloak.example.com" or "http://keycloak.default.svc.cluster.local:8080"
  realm: ""           # e.g., "kure"
  clientId: ""        # e.g., "kure-monitor"
  clientSecret: ""    # Keycloak client secret (plain string in values)
  # Or provide via existing Kubernetes Secret for security:
  existingSecret: ""  # Name of existing Kubernetes Secret containing Keycloak client secret
  existingSecretKey: "client-secret"  # Key within existingSecret (default: client-secret)
  adminRole: "kure-admin"  # Keycloak realm role mapped to Kure Monitor admin
  adminGroup: ""      # Keycloak group mapped to Kure Monitor admin (optional)
  allowedGroups: ""   # Comma-separated list of allowed Keycloak groups (optional, e.g. "developers,platform-team")
  scopes: "openid profile email"
  insecureSkipTlsVerify: false  # Set to true to disable TLS cert validation (useful for internal CAs or self-signed certs)

# Prometheus metrics configuration
prometheus:
  enabled: false          # Enable Prometheus metrics integration
  namespace: monitoring   # Namespace where Prometheus is deployed
  serviceMonitor:
    enabled: false        # Create ServiceMonitor resource (requires Prometheus Operator)

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1001
  runAsGroup: 1001
  fsGroup: 1001
