version: 2.6.2
name: kure
category: monitoring-logging
displayName: Kure - Kubernetes Failure Diagnosis
createdAt: 2026-11-19T00:00:00Z
description: |
  Kubernetes AI observability platform. Instantly detect and debug pod failures (CrashLoopBackOff, ImagePullBackOff, Pending, OOMKilled), proactively scan your entire cluster with the AI Advice engine, visualize workloads with an interactive topology Diagram, and audit your configurations with a built-in Security Scanner.
license: Apache-2.0
homeURL: https://kuremonitor.com
appVersion: "2.6.2"
containersImages:
  - name: agent
    image: ghcr.io/igor-koricanac/kure-monitor/agent:2.6.2
  - name: backend
    image: ghcr.io/igor-koricanac/kure-monitor/backend:2.6.2
  - name: frontend
    image: ghcr.io/igor-koricanac/kure-monitor/frontend:2.6.2
  - name: security-scanner
    image: ghcr.io/igor-koricanac/kure-monitor/security-scanner:2.6.2
operator: false
deprecated: false
prerelease: false
containsSecurityUpdates: false
keywords:
  - kubernetes
  - troubleshooting
  - diagnosis
  - pod-failures
  - security-scanning
  - ai-powered
  - ai-advice
  - architectural-detectors
links:
  - name: Chart Source
    url: https://github.com/igor-koricanac/kure-monitor/tree/main/helm
  - name: Documentation
    url: https://github.com/igor-koricanac/kure-monitor#readme
maintainers:
  - name: igor-koricanac
    email: igor.koricanac@gmail.com
provider:
  name: igor-koricanac
changes:
  - kind: fixed
    description: "Large-Cluster /api/pods/failed Performance: Filter active statuses inside DISTINCT ON with new PostgreSQL indexes to eliminate 60s query timeouts."
  - kind: fixed
    description: "Node-Scoped DaemonSet Agent: Scope kure-agent pods to their own node via Downward API NODE_NAME and deduplicate concurrent reports with PostgreSQL advisory locks."
  - kind: added
    description: "Automatic Resolved Pod Cleanup: Hourly background task prunes resolved pod_failures older than 24 hours to prevent unbounded table growth."
install: |
  helm repo add kure-monitor https://kuremonitor.com/

  helm install kure-monitor kure-monitor/kure --version 2.6.2 \
    --create-namespace --namespace kure-system \
    --set postgresql.password="$(openssl rand -hex 24)"

  # On first visit, the dashboard prompts you to create the initial admin account.
  ```
