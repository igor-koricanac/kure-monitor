version: 2.6.0
name: kure
category: monitoring-logging
displayName: Kure - Kubernetes Failure Diagnosis
createdAt: 2026-10-15T00:00:00Z
description: |
  Kubernetes AI observability platform. Instantly detect and debug pod failures (CrashLoopBackOff, ImagePullBackOff, Pending, OOMKilled), proactively scan your entire cluster with the AI Advice engine, visualize workloads with an interactive topology Diagram, and audit your configurations with a built-in Security Scanner.
license: Apache-2.0
homeURL: https://kuremonitor.com
appVersion: "2.6.0"
containersImages:
  - name: agent
    image: ghcr.io/igor-koricanac/kure-monitor/agent:2.6.0
  - name: backend
    image: ghcr.io/igor-koricanac/kure-monitor/backend:2.6.0
  - name: frontend
    image: ghcr.io/igor-koricanac/kure-monitor/frontend:2.6.0
  - name: security-scanner
    image: ghcr.io/igor-koricanac/kure-monitor/security-scanner:2.6.0
operator: false
deprecated: false
prerelease: false
containsSecurityUpdates: false
keywords:
  - kubernetes
  - troubleshooting
  - diagnosis
  - pod-failures
  - security-scanning
  - ai-powered
  - ai-advice
  - architectural-detectors
links:
  - name: Chart Source
    url: https://github.com/igor-koricanac/kure-monitor/tree/main/helm
  - name: Documentation
    url: https://github.com/igor-koricanac/kure-monitor#readme
maintainers:
  - name: igor-koricanac
    email: igor.koricanac@gmail.com
provider:
  name: igor-koricanac
changes:
  - kind: added
    description: "Teams & Granular Multi-Tenant RBAC: Multi-tenant team access control scoped by namespace, tabs, and permissions."
  - kind: added
    description: "Pod Monitoring Live Pods View: Real-time inventory of all cluster pods alongside failing pods."
  - kind: added
    description: "Interactive Live Log Streaming: Stream real-time container logs with play/pause and download controls."
  - kind: added
    description: "Keycloak Enterprise SSO: OpenID Connect single sign-on support via UI and Helm values with group gating."
install: |
  helm repo add kure-monitor https://kuremonitor.com/

  helm install kure-monitor kure-monitor/kure --version 2.6.0 \
    --create-namespace --namespace kure-system \
    --set postgresql.password="$(openssl rand -hex 24)"

  # On first visit, the dashboard prompts you to create the initial admin account.
  ```
