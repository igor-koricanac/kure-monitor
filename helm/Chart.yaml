apiVersion: v2
name: kure
description: Kubernetes AI observability platform with proactive AI Advice, security scanning, topology diagrams, and pod failure diagnosis.
type: application
kubeVersion: ">=1.20.0-0"
version: 2.5.0
appVersion: "2.5.0"
icon: "https://raw.githubusercontent.com/igor-koricanac/kure-monitor/main/docs/images/kure_monitor_logo_white_background.svg"
keywords:
  - kubernetes
  - monitoring
  - troubleshooting
  - security-scanning
  - ai-powered
  - pod-failure-detection
  - diagnostics
  - observability
home: https://kuremonitor.com
sources:
  - https://github.com/igor-koricanac/kure-monitor
maintainers:
  - name: igor-koricanac
    email: igor.koricanac@gmail.com
annotations:
  artifacthub.io/containsSecurityUpdates: "false"
  artifacthub.io/changes: |
    - kind: added
      description: "Multi-LLM Provider Profiles: Register multiple AI providers simultaneously with automatic failover across the pool."
    - kind: added
      description: "Custom LLM Instructions: Write Markdown instruction documents prepended to every AI prompt for domain-specific guidance."
    - kind: added
      description: "GitHub Copilot / Models: Added copilot as a first-class provider type for GitHub Models inference."
    - kind: changed
      description: "Encryption Key Preservation: Helm chart uses lookup to preserve encryption Secret across upgrades, preventing InvalidToken errors."
    - kind: changed
      description: "Dashboard UI Refresh: Consistent dark mode, multi-LLM management panel, per-finding model attribution, model selector in TroubleshootSection."
  artifacthub.io/category: monitoring-logging
  artifacthub.io/displayName: Kure - Kubernetes Failure Diagnosis
  artifacthub.io/license: Apache-2.0
  artifacthub.io/links: |
    - name: Source
      url: https://github.com/igor-koricanac/kure-monitor
    - name: Chart Source
      url: https://github.com/igor-koricanac/kure-monitor/tree/main/helm
    - name: Documentation
      url: https://github.com/igor-koricanac/kure-monitor#readme
  artifacthub.io/maintainers: |
    - name: igor-koricanac
      email: igor.koricanac@gmail.com
  artifacthub.io/operator: false
  artifacthub.io/prerelease: false
  artifacthub.io/install: |
    helm repo add kure-monitor https://kuremonitor.com/

    # Install Kure Monitor
    helm install kure-monitor kure-monitor/kure --version 2.5.0 \
      --create-namespace --namespace kure-system \
      --set postgresql.password="$(openssl rand -hex 24)"

    # After installation, configure LLM provider via the Admin panel
    # to enable AI-powered troubleshooting suggestions