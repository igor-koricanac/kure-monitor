apiVersion: v2
name: kure
description: Kubernetes AI observability platform with proactive AI Advice, security scanning, topology diagrams, and pod failure diagnosis.
type: application
kubeVersion: ">=1.20.0-0"
version: 2.6.1
appVersion: "2.6.1"
icon: "https://raw.githubusercontent.com/igor-koricanac/kure-monitor/main/docs/images/kure_monitor_logo_white_background.svg"
keywords:
  - kubernetes
  - monitoring
  - troubleshooting
  - security-scanning
  - ai-powered
  - pod-failure-detection
  - diagnostics
  - observability
home: https://kuremonitor.com
sources:
  - https://github.com/igor-koricanac/kure-monitor
maintainers:
  - name: igor-koricanac
    email: igor.koricanac@gmail.com
annotations:
  artifacthub.io/containsSecurityUpdates: "true"
  artifacthub.io/changes: |
    - kind: security
      description: "Multi-Tenant Namespace Isolation: Enforced team namespace access control across all REST endpoints and WebSocket streams for Pod Monitoring, Security Scanner, AI Advice, and Topology Diagram."
    - kind: added
      description: "Security Scanner Namespace Dropdown: Added searchable multi-select namespace filter dropdown to the Security Scan tab."
    - kind: removed
      description: "Simplified Pod Lifecycle: Removed legacy pod failure history, ignored-pod states, and retention background settings."
  artifacthub.io/category: monitoring-logging
  artifacthub.io/displayName: Kure - Kubernetes Failure Diagnosis
  artifacthub.io/license: Apache-2.0
  artifacthub.io/links: |
    - name: Source
      url: https://github.com/igor-koricanac/kure-monitor
    - name: Chart Source
      url: https://github.com/igor-koricanac/kure-monitor/tree/main/helm
    - name: Documentation
      url: https://github.com/igor-koricanac/kure-monitor#readme
  artifacthub.io/maintainers: |
    - name: igor-koricanac
      email: igor.koricanac@gmail.com
  artifacthub.io/operator: false
  artifacthub.io/prerelease: false
  artifacthub.io/install: |
    helm repo add kure-monitor https://kuremonitor.com/

    # Install Kure Monitor
    helm install kure-monitor kure-monitor/kure --version 2.6.1 \
      --create-namespace --namespace kure-system \
      --set postgresql.password="$(openssl rand -hex 24)"

    # After installation, configure LLM provider via the Admin panel
    # to enable AI-powered troubleshooting suggestions