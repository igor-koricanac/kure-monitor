apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kure-monitor
  namespace: kure-system
spec:
  valuesFrom:
    - kind: Secret
      name: kure-postgres-auth
      valuesKey: password
      targetPath: postgresql.password
  values:
    backend:
      image:
        repository: ghcr.io/igor-koricanac/kure-monitor/backend
        tag: "7f47839"
        pullPolicy: IfNotPresent
    frontend:
      image:
        repository: ghcr.io/igor-koricanac/kure-monitor/frontend
        tag: "98c2be3"
        pullPolicy: IfNotPresent
    agent:
      image:
        repository: ghcr.io/igor-koricanac/kure-monitor/agent
        tag: "2.5.0"
        pullPolicy: IfNotPresent
    securityScanner:
      image:
        repository: ghcr.io/igor-koricanac/kure-monitor/security-scanner
        tag: "2.5.0"
        pullPolicy: IfNotPresent
    postgresql:
      persistence:
        size: 2Gi
